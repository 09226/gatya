<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="tI7Fo9gy88MovRQZRfMW_inpF3XmZYSmZwS9hoNOOWc" />
<title>ぷにぷに ガシャ確率計算機（1回ずつ／10回ずつ対応版）</title>

<style>
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #b6ff6c, #8be85a);
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }
  .container {
    background: #ffffff;
    padding: 24px;
    border-radius: 16px;
    width: 650px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  h3 { margin-top: 18px; margin-bottom: 6px; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  select, input[type="number"], input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #4b6cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #3b57d6; }
  #results { margin-top: 20px; font-size: 15px; }

  .note {
    margin-top: 10px;
    font-size: 12px;
    color: #444;
    background: #f7ffe8;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #d6f5a3;
  }

  .hidden { visibility: hidden; height: 0; overflow: hidden; }
  .visible { visibility: visible; height: auto; }
</style>
</head>
<body>

<div class="container">
  <h1>ぷにぷに ガシャ確率計算機（1回ずつ／10回ずつ対応版）</h1>

  <label>ガシャの種類</label>
  <select id="gachaType" onchange="togglePickup()">
    <option value="first">初日ガシャ</option>
    <option value="super">超アップガシャ</option>
    <option value="discount">割引ガシャ</option>
    <option value="last">ラストチャンスガシャ</option>
  </select>

  <label>回し方</label>
  <select id="drawMode">
    <option value="single">1回ずつ回す</option>
    <option value="ten">10回ずつ回す</option>
  </select>

  <h3>ランク別排出率（%）</h3>

  <label>Uz++ の排出率（%）</label>
  <input id="rate_Uzpp" type="number" step="0.01" value="0.6">

  <label>Uz の排出率（%）</label>
  <input id="rate_Uz" type="number" step="0.01" value="0.8">

  <label>zzz の排出率（%）</label>
  <input id="rate_zzz" type="number" step="0.01" value="1.3">

  <h3>キャラ一覧（特定キャラを選択）</h3>

  <label>Uz++ キャラ名（カンマ区切り）</label>
  <input id="names_Uzpp" type="text" value="キリト(SAO)">

  <label>Uz キャラ名（カンマ区切り）</label>
  <input id="names_Uz" type="text" value="アリス(UW),リーファ(ALO)">

  <label>zzz キャラ名（カンマ区切り）</label>
  <input id="names_zzz" type="text" value="覚醒シリカ(ASO),覚醒ユージオ(UW)">

  <h3>複数キャラ同時当選の対象キャラ</h3>
  <label>対象キャラ名（カンマ区切り）</label>
  <input id="multiTargets" type="text" placeholder="例: キリト(SAO),アリス(UW)">

  <div id="pickupArea" class="hidden">
    <h3>ピックアップ数（確定枠の確率 = 1 / ピックアップ数）</h3>
    <input id="pickupCount" type="number" min="1" value="5">
  </div>

  <label>回す回数（特定回数以内）</label>
  <input id="pulls" type="number" min="1" placeholder="例: 200">

  <button id="calcBtn">計算する</button>

  <div class="note">
    ・1回ずつ：そのキャラだけが当たる確率／複数キャラでの当たる確率（同時当選は含めない）<br>
    ・10回ずつ：そのキャラだけが当たる確率（どこかの10回で出現）／複数キャラでの当たる確率（同じ10回で同時に出る＋別々の10回で出る）／総合確率<br>
  </div>

  <div id="results"></div>
</div>

<script>
  function togglePickup() {
    const gachaType = document.getElementById("gachaType").value;
    const area = document.getElementById("pickupArea");
    if (gachaType === "last") {
      area.classList.remove("hidden");
      area.classList.add("visible");
    } else {
      area.classList.remove("visible");
      area.classList.add("hidden");
    }
  }

  function normalProb(ratePercent, pulls) {
    const p = ratePercent / 100;
    return 1 - Math.pow(1 - p, pulls);
  }

  function getGuaranteedCount(pulls) {
    const arr = [];
    if (pulls >= 40) arr.push(40);
    if (pulls >= 50) arr.push(50);
    for (let base = 90; base <= pulls; base += 50) {
      arr.push(base);
      if (base + 10 <= pulls) arr.push(base + 10);
    }
    return arr.length;
  }

  function calcGuaranteedProb(pickupCount, guaranteedCount) {
    const p = 1 / pickupCount;
    return 1 - Math.pow(1 - p, guaranteedCount);
  }

  document.getElementById("calcBtn").addEventListener("click", () => {
    const pulls = parseInt(document.getElementById("pulls").value);
    const gachaType = document.getElementById("gachaType").value;
    const drawMode = document.getElementById("drawMode").value;

    const results = document.getElementById("results");
    results.innerHTML = "";

    if (isNaN(pulls) || pulls <= 0) {
      results.innerHTML = "回す回数を正しく入力してください。";
      return;
    }

    const rateTable = {
      "Uz++": parseFloat(document.getElementById("rate_Uzpp").value),
      "Uz": parseFloat(document.getElementById("rate_Uz").value),
      "zzz": parseFloat(document.getElementById("rate_zzz").value)
    };

    const namesTable = {
      "Uz++": document.getElementById("names_Uzpp").value.split(",").map(s => s.trim()).filter(s => s),
      "Uz": document.getElementById("names_Uz").value.split(",").map(s => s.trim()).filter(s => s),
      "zzz": document.getElementById("names_zzz").value.split(",").map(s => s.trim()).filter(s => s)
    };

    const multiTargets = document.getElementById("multiTargets").value
      .split(",").map(s => s.trim()).filter(s => s);

    const totalPickup = namesTable["Uz++"].length + namesTable["Uz"].length + namesTable["zzz"].length;

    let guaranteedProb = 0;
    if (gachaType === "last" && totalPickup > 0) {
      const guaranteedCount = getGuaranteedCount(pulls);
      guaranteedProb = calcGuaranteedProb(totalPickup, guaranteedCount);
    }

    let html = "<h3>結果一覧</h3>";

    let singleNormalProbs = [];
    let singleTotalProbs = [];
    let tenBlockHitProbs = [];   // 各キャラが1ブロック内で出る確率
    let tenBlockAnyProbs = [];   // 各キャラが指定回数以内のどこかのブロックで出る確率

    const blocks = Math.floor(pulls / 10);

    ["Uz++", "Uz", "zzz"].forEach(rank => {
      const rate = rateTable[rank];
      const names = namesTable[rank];

      names.forEach(name => {
        const baseProbSingle = normalProb(rate, pulls);
        let totalProbSingle = baseProbSingle;
        if (gachaType === "last" && totalPickup > 0) {
          totalProbSingle = 1 - (1 - baseProbSingle) * (1 - guaranteedProb);
        }

        const perBlockProb = blocks > 0 ? normalProb(rate, 10) : 0;
        const anyBlockProb = blocks > 0 ? (1 - Math.pow(1 - perBlockProb, blocks)) : 0;

        if (drawMode === "single") {
          html += `
            <div>
              <strong>${name}</strong>（${rank}）<br>
              ・そのキャラだけが当たる確率（${pulls}回以内）： ${(baseProbSingle * 100).toFixed(2)}%<br>
              ・総合当選確率（確定枠込み／${pulls}回以内）： ${(totalProbSingle * 100).toFixed(2)}%<br>
            </div><br>
          `;
        } else {
          html += `
            <div>
              <strong>${name}</strong>（${rank}）<br>
              ・そのキャラだけが当たる確率（${pulls}回以内にどこかの10回で出現）： ${(anyBlockProb * 100).toFixed(2)}%<br>
              ・そのキャラがある10回内で出現する確率（1ブロック）： ${(perBlockProb * 100).toFixed(2)}%<br>
            </div><br>
          `;
        }

        if (multiTargets.includes(name)) {
          singleNormalProbs.push(baseProbSingle);
          singleTotalProbs.push(totalProbSingle);
          if (blocks > 0) {
            tenBlockHitProbs.push(perBlockProb);
            tenBlockAnyProbs.push(anyBlockProb);
          }
        }
      });
    });

    if (multiTargets.length >= 2) {
      if (drawMode === "single") {
        const multiSingleNormal = singleNormalProbs.reduce((acc, p) => acc * p, 1);
        const multiSingleTotal = singleTotalProbs.reduce((acc, p) => acc * p, 1);

        html += `
          <hr>
          <strong>複数キャラでの当たる確率（通常排出）： ${(multiSingleNormal * 100).toFixed(4)}%</strong><br>
          <strong>複数キャラでの当たる確率（総合当選）： ${(multiSingleTotal * 100).toFixed(4)}%</strong><br>
        `;
      } else {
        if (blocks > 0 && tenBlockHitProbs.length === multiTargets.length) {
          // 同じ10回内で全ターゲットが同時に出る確率（1ブロック）
          const sameBlockProbPerBlock = tenBlockHitProbs.reduce((acc, p) => acc * p, 1);
          const sameBlockOverall = 1 - Math.pow(1 - sameBlockProbPerBlock, blocks);

          // 指定回数以内のどこかの10回で、それぞれが少なくとも1回は出る確率
          const allSomewhereProb = tenBlockAnyProbs.reduce((acc, p) => acc * p, 1);

          // 別々の10回で出る確率（同じ10回で同時に出る確率を除いた部分）
          let diffBlocksProb = allSomewhereProb - sameBlockOverall;
          if (diffBlocksProb < 0) diffBlocksProb = 0;

          const totalMultiProb = allSomewhereProb;

          html += `
            <hr>
            <strong>複数キャラでの当たる確率（どこかの10回で同時に出る確率）： ${(sameBlockOverall * 100).toFixed(4)}%</strong><br>
            <strong>複数キャラでの当たる確率（別々の10回で出る確率）： ${(diffBlocksProb * 100).toFixed(4)}%</strong><br>
            <strong>複数キャラでの総合確率（上記2つを加味）： ${(totalMultiProb * 100).toFixed(4)}%</strong><br>
          `;
        } else {
          html += `
            <hr>
            <strong>複数キャラでの当たる確率：ブロック数が不足しているため計算不可</strong><br>
          `;
        }
      }
    }

    results.innerHTML = html;
  });
</script>

</body>
</html>
