<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぷにぷに ガシャ確率計算機（ラストチャンス対応・完全統合版）</title>

<style>
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #b6ff6c, #8be85a);
    display: flex;
    justify-content: center;
    padding-top: 40px;
    margin: 0;
  }
  .container {
    background: #ffffff;
    padding: 24px;
    border-radius: 16px;
    width: 760px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  h1 { font-size: 22px; margin-bottom: 10px; text-align: center; }
  h3 { margin-top: 18px; margin-bottom: 6px; font-size: 18px; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  select, input[type="number"], input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #4b6cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }
  button:hover { background: #3b57d6; }
  #results { margin-top: 20px; font-size: 15px; line-height: 1.6; }

  .note {
    margin-top: 10px;
    font-size: 12px;
    color: #444;
    background: #f7ffe8;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #d6f5a3;
  }

  .hidden { display: none; }
  .visible { display: block; }

  .multi-banner {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    background: #f9f9ff;
  }
  .multi-banner-title {
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 15px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>ぷにぷに ガシャ確率計算機（ラストチャンス対応・完全統合版）</h1>

  <label>ガシャの種類</label>
  <select id="gachaType" onchange="togglePickup()">
    <option value="first">初日ガシャ</option>
    <option value="super">超アップガシャ</option>
    <option value="discount">割引ガシャ</option>
    <option value="last">ラストチャンスガシャ</option>
  </select>

  <label>回し方</label>
  <select id="drawMode">
    <option value="single">1回ずつ回す</option>
    <option value="ten">10回ずつ回す</option>
  </select>

  <h3>ランク別排出率（%）</h3>

  <label>Uz++ の排出率（%）</label>
  <input id="rate_Uzpp" type="number" step="0.01" value="0.6">

  <label>Uz の排出率（%）</label>
  <input id="rate_Uz" type="number" step="0.01" value="0.8">

  <label>zzz の排出率（%）</label>
  <input id="rate_zzz" type="number" step="0.01" value="1.3">

  <h3>キャラ一覧（特定キャラを選択）</h3>

  <label>Uz++ キャラ名（カンマ区切り）</label>
  <input id="names_Uzpp" type="text" value="キリト(SAO)">

  <label>Uz キャラ名（カンマ区切り）</label>
  <input id="names_Uz" type="text" value="アリス(UW),リーファ(ALO)">

  <label>zzz キャラ名（カンマ区切り）</label>
  <input id="names_zzz" type="text" value="覚醒シリカ(ASO),覚醒ユージオ(UW)">

  <h3>複数キャラ同時当選の対象キャラ</h3>
  <label>対象キャラ名（カンマ区切り）</label>
  <input id="multiTargets" type="text" placeholder="例: キリト(SAO),アリス(UW)" oninput="buildMultiCountInputs()">

  <div id="multiCountsArea"></div>

  <div id="pickupArea" class="hidden">
    <h3>ピックアップ数（確定枠の確率 = 1 / ピックアップ数）</h3>
    <input id="pickupCount" type="number" min="1" value="5">
  </div>

  <label>回す回数（特定回数以内）</label>
  <input id="pulls" type="number" min="1" placeholder="例: 200">

  <button id="calcBtn">計算する</button>

  <div class="note">
    ・ラストチャンス時：40,50,90,100,140,150,190,200…回目に確定枠が発生します。<br>
    ・確定枠では「キャラ一覧の総数 n のうち 1/n の確率」で当選します。<br>
    ・通常排出＋確定枠の合成確率で計算します。
  </div>

  <div id="results"></div>
</div>
<script>
/* ============================
   キャラ一覧の安全な split
   ============================ */
function safeSplit(str) {
  return str
    .replace(/[\n\r]/g, "")     // 改行除去
    .replace(/、/g, ",")        // 全角カンマを半角に統一
    .split(",")
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

/* ============================
   ラストチャンス：確定枠表示切替
   ============================ */
function togglePickup() {
  const gachaType = document.getElementById("gachaType").value;
  const area = document.getElementById("pickupArea");
  if (gachaType === "last") {
    area.classList.remove("hidden");
    area.classList.add("visible");
  } else {
    area.classList.remove("visible");
    area.classList.add("hidden");
  }
}

/* ============================
   通常排出：1回以上当たる確率
   ============================ */
function normalProb(ratePercent, pulls) {
  const p = ratePercent / 100;
  return 1 - Math.pow(1 - p, pulls);
}

/* ============================
   ラストチャンス確定枠の回数
   ============================ */
function getGuaranteedCount(pulls) {
  const arr = [];
  if (pulls >= 40) arr.push(40);
  if (pulls >= 50) arr.push(50);
  for (let base = 90; base <= pulls; base += 50) {
    arr.push(base);
    if (base + 10 <= pulls) arr.push(base + 10);
  }
  return arr.length;
}

/* ============================
   確定枠で1回以上当たる確率
   ============================ */
function calcGuaranteedProb(totalPickup, guaranteedCount) {
  const p = 1 / totalPickup;
  return 1 - Math.pow(1 - p, guaranteedCount);
}

/* ============================
   二項係数 C(n,k)
   ============================ */
function binomial(n, k) {
  if (k < 0 || k > n) return 0;
  if (k === 0 || k === n) return 1;
  let coeff = 1;
  for (let i = 1; i <= k; i++) {
    coeff = coeff * (n - i + 1) / i;
  }
  return coeff;
}

/* ============================
   通常排出＋確定枠込みで
   「ちょうど n 回」当たる確率
   ============================ */
function probNtimesWithGuaranteed(ratePercent, pulls, n, guaranteedCount, totalPickup) {
  const p = ratePercent / 100;
  const pg = 1 / totalPickup;
  let total = 0;

  for (let x = 0; x <= n; x++) {
    const y = n - x;

    const px = binomial(pulls, x) * Math.pow(p, x) * Math.pow(1 - p, pulls - x);
    const py = binomial(guaranteedCount, y) * Math.pow(pg, y) * Math.pow(1 - pg, guaranteedCount - y);

    total += px * py;
  }
  return total;
}

/* ============================
   複数キャラの当選回数入力欄生成
   ============================ */
function buildMultiCountInputs() {
  const area = document.getElementById("multiCountsArea");
  area.innerHTML = "";
  const multiTargets = safeSplit(document.getElementById("multiTargets").value);

  multiTargets.forEach((name, idx) => {
    const div = document.createElement("div");
    div.className = "multi-banner";
    div.innerHTML = `
      <div class="multi-banner-title">${name} の当選回数</div>
      <label>このキャラが当たる回数 n${idx+1}</label>
      <input type="number" id="multiCount_${idx}" min="0" value="1">
    `;
    area.appendChild(div);
  });
}

/* ============================
   メイン計算処理
   ============================ */
document.getElementById("calcBtn").addEventListener("click", () => {

  /* ▼ 入力取得 */
  const pulls = parseInt(document.getElementById("pulls").value);
  const gachaType = document.getElementById("gachaType").value;
  const drawMode = document.getElementById("drawMode").value;

  const results = document.getElementById("results");
  results.innerHTML = "";

  if (isNaN(pulls) || pulls <= 0) {
    results.innerHTML = "回す回数を正しく入力してください。";
    return;
  }

  /* ▼ 排出率 */
  const rateTable = {
    "Uz++": parseFloat(document.getElementById("rate_Uzpp").value),
    "Uz":   parseFloat(document.getElementById("rate_Uz").value),
    "zzz":  parseFloat(document.getElementById("rate_zzz").value)
  };

  /* ▼ キャラ一覧（安全な split を使用） */
  const namesTable = {
    "Uz++": safeSplit(document.getElementById("names_Uzpp").value),
    "Uz":   safeSplit(document.getElementById("names_Uz").value),
    "zzz":  safeSplit(document.getElementById("names_zzz").value)
  };

  /* ▼ ピックアップ総数（n） */
  const totalPickup =
    namesTable["Uz++"].length +
    namesTable["Uz"].length +
    namesTable["zzz"].length;

  /* ▼ ラストチャンス確定枠 */
  let guaranteedProb = 0;
  let guaranteedCount = 0;

  if (gachaType === "last" && totalPickup > 0) {
    guaranteedCount = getGuaranteedCount(pulls);
    guaranteedProb = calcGuaranteedProb(totalPickup, guaranteedCount);
  }

  let html = `<h3>結果一覧</h3>
              <div>ピックアップ総数（n）：${totalPickup}</div>
              <div>確定枠の回数：${guaranteedCount}</div><br>`;

  /* ▼ 10回ずつモード用 */
  const blocks = Math.floor(pulls / 10);

  /* ▼ 複数キャラ同時当選用 */
  const multiTargets = safeSplit(document.getElementById("multiTargets").value);

  let singleNormalProbs = [];
  let singleTotalProbs = [];
  let tenBlockHitProbs = [];
  let tenBlockAnyProbs = [];

  /* ============================
     各キャラの計算
     ============================ */
  ["Uz++", "Uz", "zzz"].forEach(rank => {
    const rate = rateTable[rank];
    const names = namesTable[rank];

    names.forEach(name => {

      /* ▼ 通常排出（1回以上） */
      const baseProbSingle = normalProb(rate, pulls);

      /* ▼ 確定枠込み（1回以上） */
      const totalProbSingle =
        gachaType === "last" && totalPickup > 0
          ? 1 - (1 - baseProbSingle) * (1 - guaranteedProb)
          : baseProbSingle;

      /* ▼ 10回ずつモード */
      const perBlockProb = blocks > 0 ? normalProb(rate, 10) : 0;
      const anyBlockProb = blocks > 0 ? (1 - Math.pow(1 - perBlockProb, blocks)) : 0;

      /* ▼ 出力 */
      if (drawMode === "single") {
        html += `
          <div>
            <strong>${name}</strong>（${rank}）<br>
            ・通常排出（${pulls}回以内）： ${(baseProbSingle * 100).toFixed(2)}%<br>
            ・確定枠込み（${pulls}回以内）： ${(totalProbSingle * 100).toFixed(2)}%<br>
          </div><br>
        `;
      } else {
        html += `
          <div>
            <strong>${name}</strong>（${rank}）<br>
            ・どこかの10回で出る確率： ${(anyBlockProb * 100).toFixed(2)}%<br>
            ・1ブロック内で出る確率： ${(perBlockProb * 100).toFixed(2)}%<br>
          </div><br>
        `;
      }

      /* ▼ 複数キャラ同時当選用 */
      if (multiTargets.includes(name)) {
        singleNormalProbs.push(baseProbSingle);
        singleTotalProbs.push(totalProbSingle);
        if (blocks > 0) {
          tenBlockHitProbs.push(perBlockProb);
          tenBlockAnyProbs.push(anyBlockProb);
        }
      }
    });
  });

  /* ============================
     複数キャラ同時当選
     ============================ */
  if (multiTargets.length >= 2) {

    if (drawMode === "single") {
      const multiSingleNormal = singleNormalProbs.reduce((acc, p) => acc * p, 1);
      const multiSingleTotal = singleTotalProbs.reduce((acc, p) => acc * p, 1);

      html += `
        <hr>
        <strong>複数キャラ（通常排出）： ${(multiSingleNormal * 100).toFixed(4)}%</strong><br>
        <strong>複数キャラ（確定枠込み）： ${(multiSingleTotal * 100).toFixed(4)}%</strong><br>
      `;
    } else {
      if (blocks > 0 && tenBlockHitProbs.length === multiTargets.length) {

        const sameBlockProbPerBlock = tenBlockHitProbs.reduce((acc, p) => acc * p, 1);
        const sameBlockOverall = 1 - Math.pow(1 - sameBlockProbPerBlock, blocks);

        const allSomewhereProb = tenBlockAnyProbs.reduce((acc, p) => acc * p, 1);

        let diffBlocksProb = allSomewhereProb - sameBlockOverall;
        if (diffBlocksProb < 0) diffBlocksProb = 0;

        html += `
          <hr>
          <strong>同じ10回で同時に出る確率： ${(sameBlockOverall * 100).toFixed(4)}%</strong><br>
          <strong>別々の10回で出る確率： ${(diffBlocksProb * 100).toFixed(4)}%</strong><br>
          <strong>総合確率： ${(allSomewhereProb * 100).toFixed(4)}%</strong><br>
        `;
      }
    }
  }

  results.innerHTML = html;
});
</script>
</body>
</html>
